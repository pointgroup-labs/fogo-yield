name: cranker-image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'packages/cranker/**'
      - 'packages/sdk/**'
      - deploy/cranker/Dockerfile
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/cranker-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fogo-yield-cranker

concurrency:
  group: cranker-image-${{ github.ref }}
  # Cancel superseded branch runs; never cancel a tag (release) run.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # QEMU emits arm64 layers from the amd64 runner; cranker is Node-only,
      # so emulation costs minutes, not a native recompile.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/cranker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache survives across branches (unlike the 10 GB-capped
          # gha cache); mode=max also caches intermediate layers.
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache
            type=gha
          cache-to: |
            type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
            type=gha,mode=max
          provenance: false
